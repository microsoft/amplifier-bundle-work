[project]
name = "amplifier-bundle-work"
version = "0.2.0"
description = "Provider-neutral Work composition for live Amplifier hosts"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@695f875c0908f45f8dc78b1fcde80ecddebffd7c",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
