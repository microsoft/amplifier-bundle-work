bundle:
  name: work-skills
  display_name: Work skills
  version: 0.1.0
  description: Portable Work skill library with on-demand discovery and loading.
  namespace_root: ..

# Preserve project and personal precedence before appending the canonical image
# skill. The skill-only include never mounts an image generator.
includes:
  - bundle: work-skills:behaviors/work-skill-library.yaml
  - bundle: git+https://github.com/microsoft/amplifier-bundle-imagegen@main#subdirectory=behaviors/skills.yaml
