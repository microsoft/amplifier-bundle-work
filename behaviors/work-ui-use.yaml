bundle:
  name: work-ui-use
  version: 0.1.0
  description: Optional bounded UI tasks with ordinary model selection by default.

# The spike components are unpublished. Resolve this module from an explicitly
# installed distribution or a host-owned source override; no implicit download.
tools:
  - module: tool-ui-use
    config:
      selection:
        browser:
          mode: standard
        computer:
          mode: standard

context:
  include:
    - work:context/ui-use.md
