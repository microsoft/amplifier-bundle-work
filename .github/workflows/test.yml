name: Test bundle composition
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Resolve current Amplifier sources
        run: python scripts/resolve_amplifier_latest.py --mode latest --project . --evidence "$RUNNER_TEMP/work-resolution"
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest -q
      - name: Retain resolved source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-source-resolution
          path: ${{ runner.temp }}/work-resolution
          if-no-files-found: ignore
