name: Test bundle composition
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install spreadsheet calculation engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-calc
      - name: Resolve current Amplifier sources
        run: python scripts/resolve_amplifier_latest.py --mode latest --project . --evidence "$RUNNER_TEMP/work-resolution"
      - run: uv sync --locked --group dev --group artifacts
      - run: uv run --no-sync pytest -q
      - name: Retain resolved source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-source-resolution
          path: ${{ runner.temp }}/work-resolution
          if-no-files-found: ignore
