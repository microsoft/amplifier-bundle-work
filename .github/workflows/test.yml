name: Test bundle composition
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest -q
